<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#grad)" stroke-width="20" stroke-dasharray="800" stroke-dashoffset="0" opacity="0.2"/>
    <path d="M-150 0 A 150 150 0 0 1 150 0" fill="none" stroke="url(#grad)" stroke-width="24" stroke-linecap="round"/>
    
    <path d="M0 -120 L30 -30 L120 0 L30 30 L0 120 L-30 30 L-120 0 L-30 -30 Z" fill="url(#grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="15" fill="#ffffff"/>
  </g>
</svg>
